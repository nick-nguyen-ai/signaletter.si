# Auto-merge daily issue PRs from cursor/issue-* branches.
# After a GITHUB_TOKEN squash-merge, GitHub does NOT rebuild Pages from
# "Deploy from a branch" — we explicitly request a Pages build via the API.
name: Auto-merge daily issues

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  pages: write
  checks: read

concurrency:
  group: auto-merge-issues-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-and-merge:
    # Same-repo, non-draft PRs from cursor/issue-* only. No branch protection required:
    # we squash-merge via the API once checks pass (not "Enable auto-merge").
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.head_ref, 'cursor/issue-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch base for path check
        run: git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"

      - name: Verify PR only touches allowed paths (incl. deletions and renames)
        id: paths
        run: |
          set -euo pipefail
          # Run the checker from the BASE branch, so a PR can't weaken the check it is judged by.
          git show "origin/${{ github.base_ref }}:scripts/check_pr_paths.py" > "$RUNNER_TEMP/check_pr_paths.py"
          python3 "$RUNNER_TEMP/check_pr_paths.py" "origin/${{ github.base_ref }}" HEAD

      - name: Markets v2 QA (blocks on any unresolved error; warnings don't block)
        run: |
          set -euo pipefail
          # The publish routine runs `qa_markets.py --fix` before committing; here we only verify.
          # Exit 1 = unresolved content errors, 2 = unparseable post: either way, no merge.
          mapfile -t mk < <(git diff --name-only --no-renames --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- '_posts/*-markets.md')
          if [ "${#mk[@]}" -eq 0 ]; then echo "No Markets posts changed."; exit 0; fi
          python3 -m pip install --quiet pyyaml jsonschema
          python3 scripts/qa_markets.py "${mk[@]}"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Jekyll build (github-pages gem)
        run: |
          set -euo pipefail
          bundle install
          JEKYLL_ENV=production bundle exec jekyll build

      - name: Wait for every CI job (python, jekyll, worker, changelog) to pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Merge only when all required CI check runs on the PR head succeeded.
          # Any failure (or a 40-minute timeout) leaves the PR open with an error annotation.
          required="python jekyll worker changelog"
          for i in $(seq 1 80); do
            runs=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs?per_page=100" \
              --jq '.check_runs[] | "\(.name)=\(.status)/\(.conclusion)"')
            pending=0; failed=""
            for job in $required; do
              line=$(echo "$runs" | grep -E "^$job=" | tail -1 || true)
              case "$line" in
                "$job=completed/success") ;;
                "$job=completed/"*) failed="$failed $job(${line#*/})" ;;
                *) pending=1 ;;
              esac
            done
            if [ -n "$failed" ]; then
              echo "::error::Not merging: CI job(s) failed:$failed. PR left open; fix and push to retry."
              exit 1
            fi
            if [ "$pending" -eq 0 ]; then echo "All CI jobs passed."; exit 0; fi
            echo "Waiting for CI ($i/80)…"; sleep 30
          done
          echo "::error::Not merging: CI did not finish within 40 minutes. PR left open."
          exit 1

      - name: Squash-merge into main
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Direct merge (works without branch protection). Avoid --auto.
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --squash \
            --delete-branch
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Request GitHub Pages rebuild
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: classic PAT (public_repo) or fine-grained token with Pages: Write.
          # Only needed if GITHUB_TOKEN gets 403 from pages/builds.
          PAGES_BUILD_TOKEN: ${{ secrets.PAGES_BUILD_TOKEN }}
        run: |
          set -euo pipefail
          echo "GITHUB_TOKEN merges do not trigger 'Deploy from a branch' Pages builds."
          echo "Requesting an explicit Pages build…"
          TOKEN="${PAGES_BUILD_TOKEN:-$GH_TOKEN}"
          if GH_TOKEN="$TOKEN" gh api -X POST "repos/${{ github.repository }}/pages/builds"; then
            echo "Pages build requested."
          else
            status=$?
            echo "::error::Pages build request failed (exit $status)."
            echo "Confirm Settings → Actions → General → Workflow permissions = Read and write."
            echo "If still 403, add repo secret PAGES_BUILD_TOKEN (PAT that can request Pages builds)."
            exit "$status"
          fi
